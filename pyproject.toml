[project]
name = "rl4llm"
version = "0.1.0"
description = "Reinforcement learning for language models, from first principles: an enumerable toy testbed and from-scratch implementations of the methods in the book."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
]

[project.optional-dependencies]
figures = [
    "matplotlib>=3.8",
    "networkx>=3.2",
]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rl4llm"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# One record per method, written as dict(...) calls so each reads like a method card.
"scripts/method_data.py" = ["C408"]

[tool.pytest.ini_options]
testpaths = ["tests"]
